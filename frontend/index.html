<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light Scheduler</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    .container {
      background: #222;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
    }
    label, input {
      display: block;
      margin: 1rem 0;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Light Scheduler</h2>
    <label for="on-time">ON Time:</label>
    <input type="time" id="on-time" />

    <label for="off-time">OFF Time:</label>
    <input type="time" id="off-time" />

    <button onclick="sendSchedule()">Submit Schedule</button>

    <p id="status"></p>
  </div>

  <script>
    const socket = new WebSocket("ws://localhost:8765"); // adjust if needed

    socket.onopen = () => {
      document.getElementById("status").textContent = "WebSocket connected!";
    };

    socket.onerror = (error) => {
      document.getElementById("status").textContent = "WebSocket error.";
    };

    function sendSchedule() {
      const onTime = document.getElementById("on-time").value;
      const offTime = document.getElementById("off-time").value;

      if (!onTime || !offTime) {
        alert("Please enter both ON and OFF times.");
        return;
      }

      const schedule = { on: onTime, off: offTime };
      socket.send(JSON.stringify(schedule));
      document.getElementById("status").textContent = "Schedule sent!";
    }
  </script>
</body>
</html>
